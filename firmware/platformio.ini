[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
build_src_flags = -Werror
extra_scripts = pre:scripts/check_contract.py

[env:esp32dev]

; Distributable compile deliberately ignores credentials.h.
[env:public]
build_flags = ${env.build_flags} -DCAMX_PUBLIC_BUILD
