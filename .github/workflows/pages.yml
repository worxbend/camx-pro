name: Applications and Pages
on:
  push:
    branches: [main, 'ci/pages-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: applications-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: python3 tools/website/assets.py fetch
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:assets
      - run: npm test
      - run: npm run build
      - run: npm run test:model
      - run: node apps/site/scripts/verify-site.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist
  tui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - run: ./mill --no-server app.test
        working-directory: apps/tui
      - run: ./mill --no-server app.assembly
        working-directory: apps/tui
      - run: java --enable-native-access=ALL-UNNAMED -jar out/app/assembly.dest/out.jar --demo --json
        working-directory: apps/tui
      - run: python3 apps/tui/scripts/test_pty.py
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, tui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
